name: Release

# Wird ausgelöst wenn ein Tag wie "1.0.7" gepusht wird (ohne "v")
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write      # Release erstellen und Assets hochladen
  id-token: write      # OIDC Token für Attestation
  attestations: write  # Attestation speichern

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # 1. Code auschecken
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Node.js einrichten
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # 3. Abhängigkeiten installieren
      - name: Install dependencies
        run: npm ci

      # 4. Produktions-Build
      - name: Build
        run: npm run build

      # 5. Artifact Attestation für main.js und styles.css
      - name: Attest main.js
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: main.js

      - name: Attest styles.css
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: styles.css

      # 6. GitHub Release erstellen und Assets hochladen
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css